name: Windows installer

on:
  push:
    branches: [main, windows-release]
    paths:
      - '.github/workflows/windows.yml'
      - 'google_manager/**'
      - 'macos/service_entry.py'
      - 'web/**'
      - 'windows/**'
      - 'tests/**'
      - 'recipes/**'
      - 'benefits.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13.12'
          architecture: x64
          cache: pip
          cache-dependency-path: windows/requirements.txt
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Restore and test the local service
        shell: pwsh
        run: |
          python -m pip install -r windows/requirements.txt
          python -m pip check
          python -B -m unittest discover -s tests -v
      - name: Build the native app and installer
        shell: pwsh
        run: |
          if (!(Test-Path "${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe")) { choco install innosetup --yes --no-progress }
          ./windows/build.ps1
      - name: Install and test the Windows app
        shell: pwsh
        run: ./windows/smoke.ps1
      - name: Save the verified installer and smoke results
        uses: actions/upload-artifact@v4
        with:
          name: GooglePerksManager-Windows-x64
          path: |
            dist/GooglePerksManager-Windows-x64-Setup.exe
            dist/windows-smoke.json
            dist/windows-smoke.png
          if-no-files-found: error
