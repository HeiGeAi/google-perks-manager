name: Verify Windows update from v0.10.2
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-2025
    timeout-minutes: 8
    steps:
      - name: Install v0.10.2 and verify its update to v0.10.3
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $PSNativeCommandUseErrorActionPreference = $true
          $root = Join-Path $env:RUNNER_TEMP 'google-perks-update-proof'
          New-Item -ItemType Directory $root | Out-Null
          $installation = Join-Path $root 'Application'
          $previous = Join-Path $root 'GooglePerksManager-Windows-x64-Setup.exe'
          $url = 'https://github.com/HeiGeAi/google-perks-manager/releases/download/v0.10.2/GooglePerksManager-Windows-x64-Setup.exe'
          Invoke-WebRequest -Uri $url -OutFile $previous -TimeoutSec 90
          if ((Get-FileHash $previous -Algorithm SHA256).Hash.ToLowerInvariant() -ne '63a3a59de058ad091851d78f3b9f8b9aff57a0ed0b3944a105f07da4697f2862') {
            throw 'The v0.10.2 installer did not match its published digest.'
          }
          $options = @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', ('/DIR="' + $installation + '"'))
          $setup = Start-Process $previous -ArgumentList $options -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "v0.10.2 setup failed with code $($setup.ExitCode)." }
          $env:GOOGLE_MANAGER_DATA_DIR = Join-Path $root 'LocalData'
          $service = Join-Path $installation 'backend/GoogleManagerService.exe'
          $available = & $service --windows-update check | ConvertFrom-Json
          if ($available.status -ne 'available' -or $available.version -ne '0.10.3') {
            throw 'v0.10.2 did not discover v0.10.3.'
          }
          Write-Host 'The installed v0.10.2 updater discovered v0.10.3.'
          $download = & $service --windows-update download 0.10.3 | ConvertFrom-Json
          if ($download.status -ne 'ready' -or $download.version -ne '0.10.3') {
            throw 'The signed update did not download and verify.'
          }
          $verified = & $service --windows-update verify 0.10.3 | ConvertFrom-Json
          if ($verified.version -ne '0.10.3' -or !(Test-Path $verified.path)) { throw 'The checked installer is missing.' }
          Write-Host 'v0.10.3 installer downloaded and verified with the original v0.10.2 update key.'
