<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>谷歌羊毛管理器</title>
  <link rel="icon" type="image/png" href="/brand/app-icon.png">
  <link rel="stylesheet" href="/styles.css">
  <script src="/locale.js" defer></script>
  <script src="/service-text.js" defer></script>
  <script src="/studio.js" defer></script>
  <script src="/drive.js" defer></script>
  <script src="/settings.js" defer></script>
  <script src="/benefits.js" defer></script>
  <script src="/agent.js" defer></script>
  <script src="/app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">跳到主内容</a>
  <div class="app-shell">
    <aside class="sidebar" aria-label="应用导航">
      <a class="brand" href="#colab" aria-label="谷歌羊毛管理器首页">
        <img class="brand-mark" src="/brand/app-icon.png" alt="" width="46" height="46">
        <span id="brand-name">谷歌羊毛管理器</span>
      </a>
      <nav class="nav" aria-label="工作区">
        <a href="#colab" data-page="colab"><i class="nav-icon icon-colab" aria-hidden="true"></i><span>Colab</span></a>
        <a href="#studio" data-page="studio"><i class="nav-icon icon-studio" aria-hidden="true"></i><span>创作</span></a>
        <a href="#benefits" data-page="benefits"><i class="nav-icon icon-benefits" aria-hidden="true"></i><span>权益</span></a>
        <a href="#accounts" data-page="accounts"><i class="nav-icon icon-accounts" aria-hidden="true"></i><span>账号管理</span></a>
        <a href="#agent" data-page="agent"><i class="nav-icon icon-agent" aria-hidden="true"></i><span>一键接入 Agent</span></a>
        <a href="#settings" data-page="settings"><i class="nav-icon icon-settings" aria-hidden="true"></i><span>设置</span></a>
      </nav>
      <div class="account-switch" id="account-switch"></div>
      <div class="local-indicator" id="local-indicator"></div>
    </aside>
    <main id="main" tabindex="-1">
      <div class="main-inner">
        <header id="page-header" class="page-header"><h1>Colab</h1></header>
        <div id="notice" class="notice" aria-live="polite" hidden></div>
        <div id="page-content" aria-busy="true"><div class="panel state-panel" role="status">正在加载本机工作区…</div></div>
      </div>
    </main>
  </div>
  <dialog id="dialog" aria-labelledby="dialog-title">
    <div id="dialog-content"></div>
  </dialog>
  <noscript>谷歌羊毛管理器需要 JavaScript。 Google Perks Manager requires JavaScript.</noscript>
</body>
</html>
